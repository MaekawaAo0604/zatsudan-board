<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雑談ボード</title>
  <link rel="stylesheet" href="style.css?v=20261124">
</head>
<body>
  <header class="site-header">
    <h1>雑談ボード</h1>
    <nav class="day-nav" aria-label="日付">
      <button type="button" id="prev-day" class="icon-btn" aria-label="前の日">‹</button>
      <span id="current-date" class="current-date"></span>
      <button type="button" id="next-day" class="icon-btn" aria-label="次の日">›</button>
    </nav>
  </header>

  <main class="container">
    <p class="notice">毎朝のネタの「話したい」は、みんなで共有されます。「話した」の印、おすすめとそのコメント、おすすめの「話したい」は、このブラウザの中だけに保存されます。</p>

    <div class="toolbar">
      <div class="toolbar-actions">
        <button type="button" id="random-pick" class="pick-btn">ランダムに1つ選ぶ</button>
        <button type="button" id="copy-topics" class="copy-btn">まとめてコピー</button>
      </div>
      <label class="sort">
        並び順
        <select id="sort-order">
          <option value="default">追加順</option>
          <option value="count">押された数が多い順</option>
        </select>
      </label>
    </div>

    <p id="pick-result" class="pick-result" role="status"></p>
    <p id="status" class="status" role="status"></p>
    <p id="vote-status" class="status vote-status" role="status"></p>
    <ul id="topic-list" class="topic-list"></ul>

    <section class="suggest" aria-labelledby="suggest-title">
      <h2 id="suggest-title">おすすめのネタを足す</h2>
      <form id="suggest-form">
        <label>
          ネタ
          <input name="title" required maxlength="80" placeholder="例：最近買ってよかったもの">
        </label>
        <label>
          ひとこと（任意）
          <input name="detail" maxlength="140" placeholder="話したい理由など">
        </label>
        <label>
          名前（任意）
          <input name="author" maxlength="30">
        </label>
        <button type="submit" class="primary-btn">追加する</button>
      </form>
    </section>
  </main>

  <template id="topic-template">
    <li class="topic">
      <div class="topic-body">
        <div class="topic-meta">
          <span class="badge"></span>
          <span class="author"></span>
          <span class="done-label" hidden>✓ 話した</span>
        </div>
        <h3 class="topic-title"></h3>
        <p class="topic-detail"></p>
        <div class="comments" hidden>
          <ul class="comment-list" aria-label="コメント"></ul>
          <form class="comment-form">
            <input class="comment-input" maxlength="140" placeholder="コメントを書き足す" aria-label="コメントを書き足す">
            <button type="submit" class="comment-add">書き足す</button>
          </form>
        </div>
      </div>
      <div class="topic-actions">
        <button type="button" class="vote-btn" aria-pressed="false">
          話したい <span class="count">…</span>
        </button>
        <button type="button" class="done-btn" aria-pressed="false">話した</button>
        <button type="button" class="delete-btn">削除</button>
      </div>
    </li>
  </template>

  <template id="comment-template">
    <li class="comment">
      <span class="comment-text"></span>
      <button type="button" class="comment-delete" aria-label="このコメントを削除">削除</button>
    </li>
  </template>

  <!-- ?v= は版の印（app.js の先頭の説明を参照） -->
  <script type="module" src="app.js?v=20261124"></script>
</body>
</html>
